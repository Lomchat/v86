name: CI

on:
  push:
  pull_request:

jobs:
  eslint:
    name: eslint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run eslint
        run: sudo npm install -g eslint; make eslint

  test:
    runs-on: ubuntu-latest
    name: Build and test
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0

      - name: Setup Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          check-latest: true
          registry-url: 'https://registry.npmjs.org'

      - name: Setup toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
          rustup component add rustfmt

      - name: Install APT packages
        run: |
          sudo apt-get update -y
          sudo apt-get install nasm gdb qemu-system-x86 libc6-dev-i386 -y

      - name: Build all-debug
        run: make all-debug

      - name: Build all
        run: make all

      - name: Build fallback
        run: make build/v86-fallback.wasm

      - name: rustfmt check
        run: make rustfmt

      # The emulator test suites inherited from upstream v86 (kvm-unit-tests,
      # nasm, qemu, api, devices, expect, integration) are not run here: this
      # fork no longer boots the upstream Linux test images. `make all-tests`
      # still runs them by hand.
      - name: Run rust-test
        run: make rust-test

      - name: Update package.json version
        run: make update-package-json-version

      - name: Upload the artifact
        uses: actions/upload-artifact@v4
        with:
          name: v86
          path: |
            package.json
            LICENSE
            Readme.md
            build/libv86*.js
            build/libv86*.js.map
            build/v86*.wasm
            build/*.mjs

  upload:
    name: Upload release
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/master'

    permissions:
      id-token: write
      contents: write

    steps:
      - name: Delete old release and tag
        uses: dev-drprasad/delete-tag-and-release@v1.0.1
        with:
          delete_release: true
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Get artifacts
        uses: actions/download-artifact@v4
        with:
          name: v86

      - name: Display structure of downloaded files
        run: ls -R

      - uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Release to GitHub
        uses: ncipollo/release-action@v1
        with:
          name: Latest Release
          tag: latest
          commit: master
          body: ${{ github.event.head_commit.message }}
          artifacts: "build/libv86*.js,build/libv86*.js.map,build/*.mjs,build/v86*.wasm"
          prerelease: true

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
